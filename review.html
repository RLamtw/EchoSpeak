<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="依原著校訂的《跟隨基督》全八集導讀旁白與逐場試聽。">
  <title>《跟隨基督》導讀審稿</title>
  <link rel="stylesheet" href="review.css?v=20261120">
  <script defer src="guide_review_data.js?v=20261120"></script>
  <script defer src="review.js?v=20261120"></script>
</head>
<body>
  <header class="masthead">
    <div class="wrap">
      <a class="reader-link" href="reader.html">雙語閱讀器</a>
      <h1>《跟隨基督》導讀審稿</h1>
      <p>原著修訂版 <span aria-hidden="true">·</span> 台灣華語「曉臻」試聽</p>
    </div>
  </header>
  <div class="controls">
    <div class="wrap">
      <nav id="episodes" aria-label="選擇集數"></nav>
      <div class="player-row">
        <audio id="player" controls preload="metadata" aria-label="本集旁白試聽"></audio>
        <label class="speed" for="speed">速度
          <select id="speed">
            <option value="0.9">0.9 倍</option>
            <option value="1" selected>1 倍</option>
            <option value="1.25">1.25 倍</option>
            <option value="1.5">1.5 倍</option>
          </select>
        </label>
      </div>
      <p id="audio-status" class="status" role="status"></p>
    </div>
  </div>
  <main class="wrap">
    <div class="episode-heading">
      <div>
        <h2 id="episode-title"></h2>
        <p id="episode-meta" class="muted"></p>
      </div>
      <button id="export-notes" type="button">匯出審稿備註</button>
    </div>
    <p class="note-help">勾選與備註儲存在這個瀏覽器。</p>
    <p id="note-status" class="status" role="status"></p>
    <div id="scene-list"></div>
    <details class="references">
      <summary>查閱原著與史料的方式</summary>
      <p>「PDF」頁碼指德文原著 <i>Nachfolge</i>（Dietrich Bonhoeffer Werke 第 4 卷）。ch…-p… 是雙語資料的段落編號，查引句時以德文原著正文為準。H01–H09 是下列作品、檔案和歷史資料。</p>
      <ul id="history-sources"></ul>
    </details>
    <noscript>請啟用 JavaScript 以載入劇本和試聽音檔。</noscript>
  </main>
  <template id="scene-template">
    <article class="scene">
      <div class="scene-head">
        <div class="scene-meta">
          <a class="scene-id"></a>
          <span class="chapter"></span>
        </div>
        <button class="play-scene" type="button"></button>
      </div>
      <h3 class="scene-title"></h3>
      <p class="narration"></p>
      <details class="scene-detail">
        <summary>修訂依據與畫面文字</summary>
        <p class="citation"></p>
        <p class="reason"></p>
        <ul class="screen"></ul>
      </details>
      <div class="review-bar">
        <label class="approval"><input type="checkbox"> 已審閱</label>
        <label class="note">
          <span>備註</span>
          <textarea rows="2" placeholder="記下這一場的修改意見"></textarea>
        </label>
      </div>
    </article>
  </template>
</body>
</html>
