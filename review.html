<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="依原著校訂的《跟隨基督》全八集導讀旁白與逐場試聽。">
  <title>《跟隨基督》導讀審稿</title>
  <script>
    const systemDark = matchMedia("(prefers-color-scheme: dark)");
    let savedTheme;
    try { savedTheme = localStorage.getItem("nachfolge_review_theme"); } catch {}
    const theme = savedTheme === "dark" || savedTheme === "light" ? savedTheme : "";
    document.documentElement.dataset.themeChoice = theme;
    document.documentElement.dataset.theme = theme || (systemDark.matches ? "dark" : "light");
  </script>
  <link rel="stylesheet" href="review.css?v=20261121">
  <script defer src="guide_review_data.js?v=20261121-ep01"></script>
  <script defer src="review.js?v=20261121-ep01"></script>
</head>
<body>
  <header class="masthead">
    <div class="wrap masthead-inner">
      <div>
        <h1>《跟隨基督》導讀審稿</h1>
        <p>原著修訂版 <span aria-hidden="true">·</span> 台灣華語「曉臻」試聽</p>
      </div>
      <div class="masthead-actions">
        <a class="reader-link" href="reader.html">雙語閱讀器</a>
        <button id="theme-toggle" class="icon-button theme-toggle" type="button" aria-label="夜間模式" aria-pressed="false" title="切換夜間模式">
          <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 14.1A8.8 8.8 0 0 1 9.9 3.2a9 9 0 1 0 10.9 10.9Z"/></svg>
          <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4m0-14.2-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
        </button>
      </div>
    </div>
  </header>
  <div class="controls">
    <div class="wrap">
      <nav id="episodes" aria-label="選擇集數"></nav>
      <audio id="player" preload="metadata"></audio>
      <div class="player-deck" role="group" aria-label="旁白播放器">
        <div class="transport">
          <button id="rewind" class="icon-button skip-button" type="button" aria-label="倒退 10 秒" title="倒退 10 秒">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11a9 9 0 1 1 1.6 6M3 5v6h6"/></svg>
            <span aria-hidden="true">10</span>
          </button>
          <button id="play-toggle" class="icon-button play-toggle" type="button" aria-label="播放" title="播放">
            <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.6a1 1 0 0 0-1.5.9v11a1 1 0 0 0 1.5.9l9.5-5.5a1 1 0 0 0 0-1.8Z"/></svg>
            <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="5" width="3.2" height="14" rx="1"/><rect x="13.8" y="5" width="3.2" height="14" rx="1"/></svg>
          </button>
          <button id="forward" class="icon-button skip-button forward-button" type="button" aria-label="快轉 10 秒" title="快轉 10 秒">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11a9 9 0 1 1 1.6 6M3 5v6h6"/></svg>
            <span aria-hidden="true">10</span>
          </button>
        </div>
        <div class="seek-area">
          <div class="seek-info">
            <span id="now-playing"></span>
            <span class="time"><span id="elapsed">0:00</span><span class="time-divider"> / </span><span id="total-time">0:00</span></span>
          </div>
          <input id="seek" class="seek" type="range" min="0" max="0" step="0.1" value="0" aria-label="播放進度">
        </div>
        <div class="player-options">
          <select id="speed" aria-label="播放速度" title="播放速度">
            <option value="0.9">0.9×</option>
            <option value="1" selected>1×</option>
            <option value="1.25">1.25×</option>
            <option value="1.5">1.5×</option>
          </select>
          <button id="follow-toggle" class="follow-toggle" type="button" aria-pressed="true" title="自動捲動到正在播放的文字">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M4 10h16M4 15h8m6-1v6m-3-3 3 3 3-3"/></svg>
            <span>跟讀</span>
          </button>
        </div>
      </div>
      <p id="audio-status" class="status" role="status"></p>
    </div>
  </div>
  <main class="wrap">
    <div class="episode-heading">
      <div>
        <h2 id="episode-title"></h2>
        <p id="episode-meta" class="muted"></p>
      </div>
      <button id="export-notes" type="button">匯出審稿備註</button>
    </div>
    <p class="note-help">勾選與備註儲存在這個瀏覽器。</p>
    <p id="note-status" class="status" role="status"></p>
    <div id="scene-list"></div>
    <details class="references">
      <summary>查閱原著與史料的方式</summary>
      <p>「PDF」頁碼指德文原著 <i>Nachfolge</i>（Dietrich Bonhoeffer Werke 第 4 卷）。ch…-p… 是雙語資料的段落編號，查引句時以德文原著正文為準。H01–H11 是下列作品、檔案和歷史資料。</p>
      <ul id="history-sources"></ul>
    </details>
    <noscript>請啟用 JavaScript 以載入劇本和試聽音檔。</noscript>
  </main>
  <template id="scene-template">
    <article class="scene">
      <div class="scene-head">
        <div class="scene-meta">
          <a class="scene-id"></a>
          <span class="chapter"></span>
        </div>
        <button class="play-scene" type="button">
          <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.6a1 1 0 0 0-1.5.9v11a1 1 0 0 0 1.5.9l9.5-5.5a1 1 0 0 0 0-1.8Z"/></svg>
          <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="5" width="3.2" height="14" rx="1"/><rect x="13.8" y="5" width="3.2" height="14" rx="1"/></svg>
          <span></span>
        </button>
      </div>
      <h3 class="scene-title"></h3>
      <p class="narration"></p>
      <details class="scene-detail">
        <summary>修訂依據與畫面文字</summary>
        <p class="citation"></p>
        <p class="reason"></p>
        <ul class="screen"></ul>
      </details>
      <div class="review-bar">
        <label class="approval"><input type="checkbox"> 已審閱</label>
        <label class="note">
          <span>備註</span>
          <textarea rows="2" placeholder="記下這一場的修改意見"></textarea>
        </label>
      </div>
    </article>
  </template>
</body>
</html>
